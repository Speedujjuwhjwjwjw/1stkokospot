workflows:
  android-workflow:
    name: Android Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - keystore_credentials
      vars:
        PACKAGE_NAME: "com.kokospot.food_ordering_app"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
    scripts:
      - name: Set up environment
        script: |
          cd food_ordering_app
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "PAYSTACK_CALLBACK_URL=$PAYSTACK_CALLBACK_URL" >> .env
      - name: Get dependencies
        script: |
          cd food_ordering_app
          flutter pub get
      - name: Build APK
        script: |
          cd food_ordering_app
          flutter build apk --release
    artifacts:
      - food_ordering_app/build/app/outputs/flutter-apk/*.apk

  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "com.kokospot.FoodOrderingApp"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
    scripts:
      - name: Set up environment
        script: |
          cd food_ordering_app
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "PAYSTACK_CALLBACK_URL=$PAYSTACK_CALLBACK_URL" >> .env
      - name: Get dependencies
        script: |
          cd food_ordering_app
          flutter pub get
      - name: Build iOS
        script: |
          cd food_ordering_app
          flutter build ios --release --no-codesign
    artifacts:
      - food_ordering_app/build/ios/ipa/*.ipa

  web-workflow:
    name: Web Build
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
    scripts:
      - name: Set up environment
        script: |
          cd food_ordering_app
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "PAYSTACK_CALLBACK_URL=$PAYSTACK_CALLBACK_URL" >> .env
      - name: Get dependencies
        script: |
          cd food_ordering_app
          flutter pub get
      - name: Build Web
        script: |
          cd food_ordering_app
          flutter build web --release
    artifacts:
      - food_ordering_app/build/web/**
